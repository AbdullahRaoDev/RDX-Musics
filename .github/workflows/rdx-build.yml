name: Build RDX Musics APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rdx-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed FOSS release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Restore release signing keystore
        env:
          RDX_RELEASE_KEYSTORE_BASE64: ${{ secrets.RDX_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$RDX_RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            printf '%s' "$RDX_RELEASE_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          fi

      - name: Generate CI signing keystore when no secret is configured
        run: |
          set -euo pipefail
          mkdir -p app/keystore
          if [ ! -f app/keystore/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/keystore/release.keystore \
              -storepass "${STORE_PASSWORD}" \
              -alias "${KEY_ALIAS}" \
              -keypass "${KEY_PASSWORD}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=RDX Musics, O=RDX Musics, C=US"
          fi
        env:
          STORE_PASSWORD: ${{ secrets.RDX_STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.RDX_KEY_ALIAS || 'rdxrelease' }}
          KEY_PASSWORD: ${{ secrets.RDX_KEY_PASSWORD || 'android' }}

      - name: Build signed fossRelease APK
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary
        env:
          METROLIST_APP_NAME: RDX Musics
          METROLIST_APPLICATION_ID: com.rdx.musics
          STORE_PASSWORD: ${{ secrets.RDX_STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.RDX_KEY_ALIAS || 'rdxrelease' }}
          KEY_PASSWORD: ${{ secrets.RDX_KEY_PASSWORD || 'android' }}

      - name: Rename APK
        run: |
          set -euo pipefail
          output_dir="app/build/outputs/apk/foss/release"
          apk="$(
            find "$output_dir" -maxdepth 1 -type f -name '*.apk' \
              ! -name '*-unsigned.apk' \
              \( -name '*universal*.apk' -o -name '*arm64-v8a*.apk' -o -name 'app-foss-release.apk' \) \
              | sort | head -n 1
          )"
          if [ -z "$apk" ]; then
            echo "No signed universal or arm64 fossRelease APK found in $output_dir"
            find "$output_dir" -maxdepth 2 -type f -print
            exit 1
          fi
          cp "$apk" RDX-Musics.apk

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "Android build-tools apksigner was not found"
            exit 1
          fi
          "$apksigner" verify --verbose RDX-Musics.apk

      - name: Upload RDX Musics APK
        uses: actions/upload-artifact@v4
        with:
          name: RDX-Musics
          path: RDX-Musics.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: RDX Musics v1.0.0
          files: RDX-Musics.apk
          overwrite_files: true
