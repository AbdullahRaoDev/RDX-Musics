name: Build RDX Musics APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rdx-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed FOSS release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Generate CI signing keystore
        run: |
          mkdir -p app/keystore
          keytool -genkeypair -v \
            -keystore app/keystore/release.keystore \
            -storepass android \
            -alias rdxrelease \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=RDX Musics, O=RDX Musics, C=US"

      - name: Build signed fossRelease APK
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary
        env:
          METROLIST_APP_NAME: RDX Musics
          METROLIST_APPLICATION_ID: com.rdx.musics
          STORE_PASSWORD: android
          KEY_ALIAS: rdxrelease
          KEY_PASSWORD: android

      - name: Rename APK
        run: |
          set -euo pipefail
          output_dir="app/build/outputs/apk/foss/release"
          apk="$(find "$output_dir" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "No fossRelease APK found in $output_dir"
            find "$output_dir" -maxdepth 2 -type f -print
            exit 1
          fi
          cp "$apk" RDX-Musics.apk

      - name: Upload RDX Musics APK
        uses: actions/upload-artifact@v4
        with:
          name: RDX-Musics
          path: RDX-Musics.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: RDX Musics v1.0.0
          files: RDX-Musics.apk
